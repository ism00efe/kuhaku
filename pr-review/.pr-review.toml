# pr-review configuration. Every key is optional; the values below are also the
# built-in defaults, shown here as documentation. Drop this file at a repository
# root to override behaviour for that repo only -- the engine never grows a
# per-repo code path.

# fallback_provider = ""          # last-resort provider appended to every chain.
                                  # Empty means: with no key, report a
                                  # structural-only review instead of inventing
                                  # findings. "mock" is for tests only.
# force_provider    = ""          # pin every tier to one provider (CLI --provider)
# context_strategy  = "default"
# classifier_enabled = true       # false = heuristic planner only (no small LLM)
# max_axis_findings  = 6
# max_total_findings = 12

# enabled_axes    = ["correctness", "method", "scope", "structure"]
# enabled_depths  = ["basic", "normal", "deep"]
# discoverers     = ["languages", "manifests", "layout"]
# verifiers       = ["deterministic", "llm"]
# reporters       = ["markdown", "json"]

[limits]
diff_bytes = 16000
aux_bytes = 8000
context_max_bytes = 24000

[concurrency]
# Groq's free tier is capped at 8K tokens/minute for the gpt-oss models, and a
# normal-depth prompt is 6-7K tokens on its own -- so anything running on Groq
# is effectively one request per minute. Keep axes sequential.
workers = 1
axis_delay_seconds = 0
retry_wait_seconds = 60
max_retries = 2
# retry_wait_seconds doubles as the bench time: once a candidate has burned its
# retries on a throttle, it is skipped for this long instead of being retried
# from scratch by every remaining task in the run.

[verification]
enabled = true
llm_enabled = true
llm_min_severity = "warning"
uncertain_low = 0.35
uncertain_high = 0.8
max_llm_verifications = 6

# --- providers -------------------------------------------------------------
# kind is the registered transport: "openai_compat" | "gemini" | "mock".
[providers.groq]
kind = "openai_compat"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
default_model = "openai/gpt-oss-20b"

[providers.openrouter]
kind = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
default_model = "z-ai/glm-5.2:free"

# OpenCode Zen. Free, coding-oriented, OpenAI-compatible -- but its free entries
# are time-limited trials that rotate, and its per-model limits are unpublished,
# so it is wired in as a *fallback* with no pinned model. Set default_model (or a
# model on the fallback entry below) to a currently-live id to arm it. Note that
# some free entries forbid confidential data: check before enabling it on a
# private repository.
[providers.opencode]
kind = "openai_compat"
base_url = "https://opencode.ai/zen/v1"
api_key_env = "OPENCODE_API_KEY"
default_model = "nemotron-3-ultra-free"

# --- model tiers -----------------------------------------------------------
# Logical roles bound to a provider + concrete model, plus an ordered fallback
# list. The split follows the shape of the two free tiers, which are capped
# oppositely:
#
#   Groq        30 requests/min, but only 8K tokens/min  -> many small calls
#   OpenRouter  20 requests/min, 1000 :free calls/day    -> few large calls
#
# Planning and basic reviews are small and frequent, so they go to Groq. The
# token-heavy normal/deep/verify work goes to OpenRouter, where a 7K-token
# prompt costs one request instead of a whole minute of Groq's token budget.
# At ~10 requests per PR, the 1000/day allowance is roughly 100 PRs a day.
#
# A fallback entry whose provider has no API key, or no model to send, is
# skipped silently -- so leaving opencode unconfigured costs nothing.
#
# On the OpenRouter side the primary is minimax-m3:free rather than
# glm-5.2:free: the latter is frequently 429'd *upstream* (the shared free pool
# behind it, not this account's daily quota), so it earns its place as a
# fallback rather than the first call. Both are one request against the same
# 1000/day allowance, so the order costs nothing to change back.

[model_tiers.planner]
provider = "groq"
model = "openai/gpt-oss-20b"
max_tokens = 700
fallbacks = [{ provider = "openrouter", model = "minimax/minimax-m3:free" }]

[model_tiers.basic]
provider = "groq"
model = "openai/gpt-oss-20b"
max_tokens = 1200
fallbacks = [{ provider = "openrouter", model = "minimax/minimax-m3:free" }]

[model_tiers.normal]
provider = "openrouter"
model = "minimax/minimax-m3:free"
max_tokens = 1600
fallbacks = [
    { provider = "openrouter", model = "z-ai/glm-5.2:free" },
    { provider = "groq", model = "openai/gpt-oss-120b" },
]

[model_tiers.deep]
provider = "openrouter"
model = "minimax/minimax-m3:free"
max_tokens = 2200
fallbacks = [
    { provider = "openrouter", model = "z-ai/glm-5.2:free" },
    { provider = "opencode", model = "nemotron-3-ultra-free" },
    { provider = "groq", model = "openai/gpt-oss-120b" },
]

# verify deliberately leads with a DIFFERENT model than deep. A model asked to
# check its own output tends to agree with it; an independent one makes
# uncorrelated mistakes, which is the whole point of a verification pass.
[model_tiers.verify]
provider = "openrouter"
model = "z-ai/glm-5.2:free"
max_tokens = 1200
fallbacks = [
    { provider = "openrouter", model = "minimax/minimax-m3:free" },
    { provider = "groq", model = "openai/gpt-oss-120b" },
]

# --- degradation ladder ----------------------------------------------------
# When every candidate of a tier is exhausted -- daily quota gone, model
# retired -- borrow the next tier's models rather than dropping the task. The
# review still runs, on a weaker model, and the report records that it was
# degraded. Set a tier to [] to make its exhaustion fatal instead.
[tier_degradation]
deep = ["normal", "basic"]
normal = ["basic"]
verify = ["normal", "basic"]
basic = []
planner = []
