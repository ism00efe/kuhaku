# pr-review — bring your own OpenAI-compatible provider.
#
# Put this file at the ROOT of the repository you want reviewed (next to your
# README), not inside .github/. The engine reads it from the repo under review,
# so every repository tunes itself and the shared action stays untouched.
#
# FOUR THINGS TO CHANGE, all marked CHANGE below:
#   1. base_url        your provider's OpenAI-compatible endpoint
#   2. api_key_env     the env var your key arrives in (must match the workflow)
#   3. default_model   the model id your provider expects
#   4. context_tokens  that model's real context window
#
# Everything else has a working default.

# One provider for every tier. Simplest possible start: the planner, the review
# axes and the verifier all run on this model, with per-tier output sizes kept.
force_provider = "myllm"

[providers.myllm]
kind = "openai_compat"                          # /chat/completions -- the common shape
base_url = "https://api.example.com/v1"         # CHANGE (1) -- no trailing /chat/completions
api_key_env = "MY_LLM_API_KEY"                  # CHANGE (2) -- same name as in the workflow
default_model = "my-model-name"                 # CHANGE (3)

# What this model accepts. Declaring it is what lets a large pull request be
# reviewed in one pass: an undeclared model is assumed to hold 32K tokens, which
# is safe but splits big changes into more requests than necessary.
[models."my-model-name"]                        # CHANGE (3) -- same id as above
context_tokens = 131072                         # CHANGE (4) -- the model's real window
# tokens_per_minute = 60000                     # only if your provider caps throughput
                                                # per minute; omit when it counts requests

# ---------------------------------------------------------------------------
# Optional, once the basics work.
# ---------------------------------------------------------------------------
#
# Different models per tier: drop `force_provider` above and describe the tiers.
# Planning and shallow passes are small and frequent -- a cheap model is enough;
# the deep read and the verifier are where a stronger model earns its cost.
# `verify` deliberately differs from `deep`: a model asked to check its own
# output tends to agree with it.
#
# [providers.myllm]
# ... as above, plus a second [models."small-model"] block ...
#
# [model_tiers.planner]
# provider = "myllm"
# model = "small-model"
# max_tokens = 700
#
# [model_tiers.deep]
# provider = "myllm"
# model = "my-model-name"
# max_tokens = 2200
# fallbacks = [{ provider = "myllm", model = "small-model" }]
#
# [model_tiers.verify]
# provider = "myllm"
# model = "another-model"
# max_tokens = 1200

# Which axes run, and how many requests a single pull request may cost.
# [limits]
# max_passes_per_axis = 4     # a change too big for one request is split into
                              # passes; each pass is one request. 0 = no cap.
