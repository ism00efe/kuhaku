name: pr-agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PR-Agent
        uses: the-pr-agent/pr-agent@v0.43.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Groq free tier (https://github.com/raullenchai/free-llm-api-resources).
          # pr-agent uses LiteLLM as its model router: the "groq/<model>" prefix and
          # the GROQ_API_KEY env var are all it needs -- no adapter code here, unlike
          # review.yml. Switch provider = change these two config.* strings and the key.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          config.model: "groq/openai/gpt-oss-120b"
          config.fallback_models: '["groq/openai/gpt-oss-20b"]'
          config.patch_extra_lines_before: "8"
          config.patch_extra_lines_after: "8"
          # Groq's free tier is ~12k tokens/minute. Keep the prompt under that and let
          # pr-agent clip oversized patches instead of failing.
          config.max_model_tokens: "12000"
          config.custom_model_max_tokens: "12000"
          config.large_patch_policy: "clip"
          config.temperature: "0.2"
          config.ai_timeout: "600"
          pr_reviewer.require_security_review: "true"
          pr_reviewer.require_can_be_split_review: "true"
          pr_reviewer.require_tests_review: "true"
          pr_reviewer.require_estimate_effort_to_review: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
