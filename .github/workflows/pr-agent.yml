name: pr-agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  pr-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/328234140484/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-ci@finops-agent-497422.iam.gserviceaccount.com

      - name: Run PR-Agent
        uses: the-pr-agent/pr-agent@v0.43.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "vertex_ai/gemini-2.5-flash"
          config.fallback_models: '["vertex_ai/gemini-2.5-flash"]'
          config.patch_extra_lines_before: "20"
          config.patch_extra_lines_after: "20"
          config.max_model_tokens: "200000"
          config.custom_model_max_tokens: "200000"
          config.large_patch_policy: "clip"
          config.temperature: "1.0"
          config.ai_timeout: "600"
          pr_reviewer.require_security_review: "true"
          pr_reviewer.require_can_be_split_review: "true"
          pr_reviewer.require_tests_review: "true"
          pr_reviewer.require_estimate_effort_to_review: "true"
          vertexai.vertex_project: "finops-agent-497422"
          vertexai.vertex_location: "global"
          VERTEXAI_PROJECT: "finops-agent-497422"
          VERTEXAI_LOCATION: "global"
          GOOGLE_CLOUD_PROJECT: "finops-agent-497422"
          GOOGLE_CLOUD_LOCATION: "global"
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
