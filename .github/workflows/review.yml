name: review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write      # to write the comment
  id-token: write           # for WIF

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history needed for diff

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/328234140484/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-ci@finops-agent-497422.iam.gserviceaccount.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install google-genai

      - name: Gemini four-axis review
        env:
          GOOGLE_CLOUD_PROJECT: finops-agent-497422
          GOOGLE_CLOUD_LOCATION: global
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python - <<'PY'
          import os
          import json
          import pathlib
          import subprocess
          import concurrent.futures
          from google import genai

          base_ref = os.environ.get("BASE_REF", "main")
          pr_title = os.environ.get("PR_TITLE", "")
          pr_body = os.environ.get("PR_BODY", "")

          # 1. Prepare inputs
          DIFF_LIMIT = 100000
          diff_truncated = False

          def get_diff(unified):
              return subprocess.check_output(
                  ["git", "diff", f"--unified={unified}", f"origin/{base_ref}...HEAD"],
                  text=True, stderr=subprocess.DEVNULL
              )

          try:
              diff_full = get_diff(20)
              if len(diff_full) > DIFF_LIMIT:
                  # kuhaku's PRs can be larger: retry with narrower context first
                  diff_full = get_diff(5)
              if len(diff_full) > DIFF_LIMIT:
                  diff_full = diff_full[:DIFF_LIMIT]
                  diff_truncated = True
          except Exception:
              diff_full = ""

          try:
              name_status = subprocess.check_output(
                  ["git", "diff", "--name-status", f"origin/{base_ref}...HEAD"],
                  text=True, stderr=subprocess.DEVNULL
              )[:20000]
          except Exception:
              name_status = ""

          try:
              dep_diff = subprocess.check_output(
                  ["git", "diff", "--unified=20", f"origin/{base_ref}...HEAD", "--",
                   "*pyproject.toml*", "*requirements*.txt", "*uv.lock*", "*Pipfile*",
                   "*poetry.lock*", "*package.json*", "*pnpm-lock.yaml*", "*yarn.lock*",
                   "*Dockerfile*"],
                  text=True, stderr=subprocess.DEVNULL
              )[:50000]
          except Exception:
              dep_diff = ""

          REPORT_ONLY_PROBLEMS = """Report only problems: something missing, incorrect, risky, or unclear.
          Do NOT report that a change is good, well-designed, or an improvement.
          Praise is not a finding. Do NOT describe or summarize what the diff does --
          that is not a finding either. If you cannot name a concrete problem,
          return an empty findings list."""

          def make_suffix(axis_name):
              return f"""{REPORT_ONLY_PROBLEMS}

          Return ONLY JSON, no other text, no markdown code block.
          Schema:
          {{"axis":"{axis_name}","findings":[{{"severity":"blocker|warning",
          "location":"file:line or '-'","title":"one sentence","detail":"at most two sentences"}}]}}
          If you have nothing to say, leave the findings list EMPTY. An empty list is a
          valid and expected answer. Do not invent or pad findings, do not write generic
          advice. Report only concrete things VISIBLE in this input. If you cannot justify
          warning severity or above, return no finding. Write in English."""

          # Axis prompts
          prompt_correctness = f"""You are a code reviewer. Examine the diff below for
          CORRECTNESS: bugs, missed edge cases, missing error handling, resource leaks.

          DIFF:
          {diff_full}

          {make_suffix("correctness")}"""

          prompt_method = f"""You are a code reviewer. Examine the approach taken in the
          diff below. Report only where the chosen approach has a gap, an unhandled case,
          an unstated tradeoff that will cause trouble later, or where a materially better
          alternative was available. Do not restate what was done.

          DIFF:
          {diff_full}

          {make_suffix("method")}"""

          prompt_scope = f"""You are a code reviewer. Examine the list of changed files below,
          along with the PR title and PR body, for SCOPE: does the work done match what the
          PR claims to do.

          PR TITLE:
          {pr_title}

          PR BODY:
          {pr_body}

          CHANGED FILES (git diff --name-status):
          {name_status}

          {make_suffix("scope")}"""

          prompt_structure = f"""You are a code reviewer. Examine the list of changed files
          below and the diff of dependency files for STRUCTURE: new top-level folders, new
          external dependencies, changes in the direction of dependency between layers. Look
          for both excessive fragmentation and excessive accumulation.

          CHANGED FILES (git diff --name-status):
          {name_status}

          DEPENDENCY FILES DIFF:
          {dep_diff if dep_diff.strip() else "(No changes in dependency files)"}

          {make_suffix("structure")}"""

          client = genai.Client()

          def review_axis(axis_name, prompt):
              raw_text = ""
              try:
                  r = client.models.generate_content(
                      model="gemini-2.5-flash", contents=prompt
                  )
                  raw_text = r.text or ""
                  cleaned = raw_text.strip()
                  if cleaned.startswith("```"):
                      lines = cleaned.splitlines()
                      if lines and lines[0].startswith("```"):
                          lines = lines[1:]
                      if lines and lines[-1].startswith("```"):
                          lines = lines[:-1]
                      cleaned = "\n".join(lines).strip()
                  data = json.loads(cleaned)
                  return axis_name, data, raw_text, None
              except Exception as e:
                  return axis_name, None, raw_text, str(e)

          axes_tasks = [
              ("correctness", prompt_correctness),
              ("method", prompt_method),
              ("scope", prompt_scope),
              ("structure", prompt_structure),
          ]

          results = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              futures = {
                  executor.submit(review_axis, axis_name, prompt): axis_name
                  for axis_name, prompt in axes_tasks
              }
              for future in concurrent.futures.as_completed(futures):
                  axis_name, data, raw_text, err = future.result()
                  results[axis_name] = {"data": data, "raw": raw_text, "error": err}

          # Sort and merge
          severity_order = {"blocker": 0, "warning": 1}
          all_findings = []
          for axis_name in ["correctness", "method", "scope", "structure"]:
              res = results.get(axis_name, {})
              data = res.get("data")
              if data and isinstance(data, dict) and "findings" in data and isinstance(data["findings"], list):
                  for f in data["findings"]:
                      if isinstance(f, dict):
                          f_copy = dict(f)
                          f_copy["axis"] = axis_name
                          all_findings.append(f_copy)

          all_findings.sort(key=lambda x: severity_order.get(str(x.get("severity", "")).lower(), 2))
          high_priority = [f for f in all_findings if str(f.get("severity", "")).lower() in ["blocker", "warning"]][:5]

          lines = ["## Gemini PR Review (4 Axes)\n"]
          if diff_truncated:
              lines.append("> WARNING: diff was truncated, review may be incomplete\n")
          lines.append("### Key Findings (Blocker & Warning)")
          if high_priority:
              for f in high_priority:
                  sev = str(f.get("severity", "warning")).upper()
                  loc = f.get("location", "-")
                  title = f.get("title", "")
                  detail = f.get("detail", "")
                  lines.append(f"- **[{sev}]** `{loc}` {title} — {detail}")
          else:
              lines.append("- No blocker or warning level findings detected.")

          lines.append("\n---\n")

          axis_display_names = {
              "correctness": "Correctness",
              "method": "Method",
              "scope": "Scope",
              "structure": "Structure",
          }

          for axis_name in ["correctness", "method", "scope", "structure"]:
              res = results.get(axis_name, {})
              disp_name = axis_display_names.get(axis_name, axis_name)
              err = res.get("error")
              if err:
                  lines.append(f"<details>\n<summary><b>{disp_name} — PARSE ERROR</b></summary>\n\nParse error: `{err}`\n\n```\n{res.get('raw', '')}\n```\n</details>\n")
              else:
                  data = res.get("data") or {}
                  findings = data.get("findings", []) if isinstance(data, dict) and isinstance(data.get("findings"), list) else []
                  count = len(findings)
                  lines.append(f"<details>\n<summary><b>{disp_name} ({count} findings)</b></summary>\n")
                  if count == 0:
                      lines.append("\nNo findings.\n")
                  else:
                      lines.append("")
                      for f in findings:
                          if isinstance(f, dict):
                              sev = str(f.get("severity", "warning")).upper()
                              loc = f.get("location", "-")
                              title = f.get("title", "")
                              detail = f.get("detail", "")
                              lines.append(f"- **[{sev}]** `{loc}` **{title}**: {detail}")
                      lines.append("")
                  lines.append("</details>\n")

          lines.append("<details>\n<summary><b>Raw JSON Output</b></summary>\n")
          lines.append(f"\ndiff truncated: {'yes' if diff_truncated else 'no'}\n")
          lines.append("```json")
          raw_output = {}
          for k in ["correctness", "method", "scope", "structure"]:
              res = results.get(k, {})
              if res.get("data") is not None:
                  raw_output[k] = res["data"]
              else:
                  raw_output[k] = {"raw": res.get("raw"), "error": res.get("error")}
          lines.append(json.dumps(raw_output, indent=2, ensure_ascii=False))
          lines.append("```\n</details>\n")

          output_md = "\n".join(lines)
          pathlib.Path("/tmp/review.md").write_text(output_md, encoding="utf-8")
          PY

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.md
