name: review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write      # to write the comment

# --- LLM configuration -------------------------------------------------------
# The four-axis judge is model-independent: which provider and model it uses is
# decided entirely by these env vars, never hard-coded in the script below.
# Switch provider = change these values (and the secret). Add a provider =
# one Adapter subclass + one _PROVIDERS entry in the inline script; nothing
# else changes.
#
#   LLM_PROVIDER   groq | openrouter | cerebras | nvidia | mistral | openai | gemini
#                  (all but `gemini` are OpenAI-compatible and share one adapter)
#   LLM_MODEL      provider's model id
#   LLM_API_KEY    the provider's key (from a repository secret)
#   LLM_BASE_URL   optional override of the provider's default endpoint
#   LLM_MAX_CONCURRENCY / LLM_AXIS_DELAY   pace the 4 calls under a free-tier rate limit
#   REVIEW_DIFF_LIMIT / REVIEW_AUX_LIMIT   input sizes (chars) — shrink for small free-tier
#                                          token/minute budgets, grow for big-context models
#
# Current: Groq free tier (https://github.com/raullenchai/free-llm-api-resources),
# ~12k tokens/minute — hence sequential calls, a pause between them, and trimmed inputs.
env:
  LLM_PROVIDER: groq
  LLM_MODEL: openai/gpt-oss-120b
  LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
  LLM_TEMPERATURE: "0"
  LLM_MAX_TOKENS: "1500"
  LLM_MAX_CONCURRENCY: "1"
  LLM_AXIS_DELAY: "25"
  REVIEW_DIFF_LIMIT: "16000"
  REVIEW_AUX_LIMIT: "8000"

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history needed for diff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the Google AI Studio adapter needs a third-party package; the
      # OpenAI-compatible adapter (Groq and friends) uses the standard library.
      - if: env.LLM_PROVIDER == 'gemini'
        run: pip install google-genai

      - name: Four-axis review
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python - <<'PY'
          import os
          import json
          import pathlib
          import subprocess
          import time
          import urllib.request
          import urllib.error
          import concurrent.futures

          base_ref = os.environ.get("BASE_REF", "main")
          pr_title = os.environ.get("PR_TITLE", "")
          pr_body = os.environ.get("PR_BODY", "")

          # --- LLM adapter layer ---------------------------------------------
          # One method: complete(prompt) -> str. The rest of this script talks
          # only to this interface, so a new provider never touches the review
          # logic or the output assembly.

          class LLMError(RuntimeError):
              pass

          class OpenAICompatAdapter:
              """POST {base_url}/chat/completions, Bearer auth, OpenAI response
              shape. Covers Groq, OpenRouter, Cerebras, NVIDIA NIM, Mistral,
              OpenAI -- every OpenAI-compatible entry in
              https://github.com/raullenchai/free-llm-api-resources ."""

              def __init__(self, *, api_key, model, base_url, temperature=0.0,
                           max_tokens=0, timeout=600):
                  if not api_key:
                      raise LLMError("LLM_API_KEY is empty")
                  self.api_key = api_key
                  self.model = model
                  self.base_url = base_url.rstrip("/")
                  self.temperature = temperature
                  self.max_tokens = max_tokens
                  self.timeout = timeout

              def complete(self, prompt):
                  payload = {
                      "model": self.model,
                      "temperature": self.temperature,
                      "messages": [{"role": "user", "content": prompt}],
                  }
                  if self.max_tokens:
                      payload["max_tokens"] = self.max_tokens
                  req = urllib.request.Request(
                      f"{self.base_url}/chat/completions",
                      data=json.dumps(payload).encode(),
                      headers={
                          "Authorization": f"Bearer {self.api_key}",
                          "Content-Type": "application/json",
                          # Groq (and others) sit behind Cloudflare, which 403s the
                          # default urllib User-Agent -- send a real one.
                          "User-Agent": "kuhaku-pr-review/1.0",
                      },
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=self.timeout) as resp:
                          data = json.loads(resp.read())
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")[:500]
                      raise LLMError(f"HTTP {e.code}: {body}") from e
                  except (urllib.error.URLError, TimeoutError) as e:
                      raise LLMError(f"request failed: {e}") from e
                  try:
                      return data["choices"][0]["message"]["content"] or ""
                  except (KeyError, IndexError, TypeError) as e:
                      raise LLMError(f"unexpected response: {str(data)[:500]}") from e

          class GeminiAdapter:
              """Google AI Studio in API-key mode (not Vertex). Needs google-genai."""

              def __init__(self, *, api_key, model, **_ignored):
                  if not api_key:
                      raise LLMError("LLM_API_KEY is empty")
                  from google import genai
                  self._client = genai.Client(api_key=api_key)
                  self.model = model

              def complete(self, prompt):
                  r = self._client.models.generate_content(
                      model=self.model, contents=prompt
                  )
                  return r.text or ""

          _PROVIDERS = {
              "groq":       ("https://api.groq.com/openai/v1",        OpenAICompatAdapter),
              "openrouter": ("https://openrouter.ai/api/v1",          OpenAICompatAdapter),
              "cerebras":   ("https://api.cerebras.ai/v1",            OpenAICompatAdapter),
              "nvidia":     ("https://integrate.api.nvidia.com/v1",   OpenAICompatAdapter),
              "mistral":    ("https://api.mistral.ai/v1",             OpenAICompatAdapter),
              "openai":     ("https://api.openai.com/v1",             OpenAICompatAdapter),
              "gemini":     (None,                                    GeminiAdapter),
          }

          def build_adapter():
              provider = os.environ.get("LLM_PROVIDER", "groq").strip().lower()
              if provider not in _PROVIDERS:
                  raise LLMError(
                      f"unknown LLM_PROVIDER '{provider}'; "
                      f"known: {', '.join(sorted(_PROVIDERS))}"
                  )
              default_base, cls = _PROVIDERS[provider]
              model = os.environ.get("LLM_MODEL", "").strip()
              if not model:
                  raise LLMError("LLM_MODEL is not set")
              return cls(
                  api_key=os.environ.get("LLM_API_KEY", ""),
                  model=model,
                  base_url=os.environ.get("LLM_BASE_URL", "").strip() or (default_base or ""),
                  temperature=float(os.environ.get("LLM_TEMPERATURE", "0") or 0),
                  max_tokens=int(os.environ.get("LLM_MAX_TOKENS", "0") or 0),
              )

          _RETRYABLE = ("429", "413", "rate limit", "rate_limit", "quota", "overloaded", "503")

          def complete_with_retry(adapter, prompt, attempts=3):
              for attempt in range(attempts):
                  try:
                      return adapter.complete(prompt)
                  except LLMError as e:
                      msg = str(e).lower()
                      if attempt < attempts - 1 and any(t in msg for t in _RETRYABLE):
                          time.sleep(60)
                          continue
                      raise

          # 1. Prepare inputs
          DIFF_LIMIT = int(os.environ.get("REVIEW_DIFF_LIMIT", "100000") or 100000)
          AUX_LIMIT = int(os.environ.get("REVIEW_AUX_LIMIT", "20000") or 20000)
          diff_truncated = False

          def get_diff(unified):
              return subprocess.check_output(
                  ["git", "diff", f"--unified={unified}", f"origin/{base_ref}...HEAD"],
                  text=True, stderr=subprocess.DEVNULL
              )

          try:
              diff_full = get_diff(20)
              if len(diff_full) > DIFF_LIMIT:
                  # kuhaku's PRs can be larger: retry with narrower context first
                  diff_full = get_diff(5)
              if len(diff_full) > DIFF_LIMIT:
                  diff_full = diff_full[:DIFF_LIMIT]
                  diff_truncated = True
          except Exception:
              diff_full = ""

          try:
              name_status = subprocess.check_output(
                  ["git", "diff", "--name-status", f"origin/{base_ref}...HEAD"],
                  text=True, stderr=subprocess.DEVNULL
              )[:AUX_LIMIT]
          except Exception:
              name_status = ""

          try:
              dep_diff = subprocess.check_output(
                  ["git", "diff", "--unified=20", f"origin/{base_ref}...HEAD", "--",
                   "*pyproject.toml*", "*requirements*.txt", "*uv.lock*", "*Pipfile*",
                   "*poetry.lock*", "*package.json*", "*pnpm-lock.yaml*", "*yarn.lock*",
                   "*Dockerfile*"],
                  text=True, stderr=subprocess.DEVNULL
              )[:AUX_LIMIT]
          except Exception:
              dep_diff = ""

          try:
              architecture_doc = pathlib.Path("ARCHITECTURE.md").read_text()[:AUX_LIMIT]
          except Exception:
              architecture_doc = ""

          REPORT_ONLY_PROBLEMS = """Report only problems: something missing, incorrect, risky, or unclear.
          Do NOT report that a change is good, well-designed, or an improvement.
          Praise is not a finding. Do NOT describe or summarize what the diff does --
          that is not a finding either. If you cannot name a concrete problem,
          return an empty findings list."""

          def make_suffix(axis_name):
              return f"""{REPORT_ONLY_PROBLEMS}

          Return ONLY JSON, no other text, no markdown code block.
          Schema:
          {{"axis":"{axis_name}","findings":[{{"severity":"blocker|warning",
          "location":"file:line or '-'","title":"one sentence","detail":"at most two sentences"}}]}}
          If you have nothing to say, leave the findings list EMPTY. An empty list is a
          valid and expected answer. Do not invent or pad findings, do not write generic
          advice. Report only concrete things VISIBLE in this input. If you cannot justify
          warning severity or above, return no finding. Write in English."""

          # Axis prompts
          prompt_correctness = f"""You are a code reviewer. Examine the diff below for
          CORRECTNESS: bugs, missed edge cases, missing error handling, resource leaks.

          DIFF:
          {diff_full}

          {make_suffix("correctness")}"""

          prompt_method = f"""You are a code reviewer. Examine the approach taken in the
          diff below. Report only where the chosen approach has a gap, an unhandled case,
          an unstated tradeoff that will cause trouble later, or where a materially better
          alternative was available. Do not restate what was done.

          DIFF:
          {diff_full}

          {make_suffix("method")}"""

          prompt_scope = f"""You are a code reviewer. Examine the list of changed files below,
          along with the PR title and PR body, for SCOPE: does the work done match what the
          PR claims to do.

          PROJECT ARCHITECTURE (for context on intended boundaries; may be unavailable):
          {architecture_doc if architecture_doc else "(not available)"}

          PR TITLE:
          {pr_title}

          PR BODY:
          {pr_body}

          CHANGED FILES (git diff --name-status):
          {name_status}

          {make_suffix("scope")}"""

          prompt_structure = f"""You are a code reviewer. Examine the list of changed files
          below and the diff of dependency files for STRUCTURE: new top-level folders, new
          external dependencies, changes in the direction of dependency between layers. Look
          for both excessive fragmentation and excessive accumulation.

          CHANGED FILES (git diff --name-status):
          {name_status}

          DEPENDENCY FILES DIFF:
          {dep_diff if dep_diff.strip() else "(No changes in dependency files)"}

          {make_suffix("structure")}"""

          adapter = build_adapter()

          def review_axis(axis_name, prompt):
              raw_text = ""
              try:
                  raw_text = complete_with_retry(adapter, prompt) or ""
                  cleaned = raw_text.strip()
                  if cleaned.startswith("```"):
                      lines = cleaned.splitlines()
                      if lines and lines[0].startswith("```"):
                          lines = lines[1:]
                      if lines and lines[-1].startswith("```"):
                          lines = lines[:-1]
                      cleaned = "\n".join(lines).strip()
                  data = json.loads(cleaned)
                  return axis_name, data, raw_text, None
              except Exception as e:
                  return axis_name, None, raw_text, str(e)

          axes_tasks = [
              ("correctness", prompt_correctness),
              ("method", prompt_method),
              ("scope", prompt_scope),
              ("structure", prompt_structure),
          ]

          # Concurrency is capped by config: free tiers with a tokens/minute limit
          # run the axes one at a time with a pause; big-context providers can raise
          # LLM_MAX_CONCURRENCY back to 4.
          concurrency = max(1, int(os.environ.get("LLM_MAX_CONCURRENCY", "4") or 4))
          axis_delay = float(os.environ.get("LLM_AXIS_DELAY", "0") or 0)

          results = {}
          if concurrency == 1:
              for i, (axis_name, prompt) in enumerate(axes_tasks):
                  if i and axis_delay:
                      time.sleep(axis_delay)
                  name, data, raw_text, err = review_axis(axis_name, prompt)
                  results[name] = {"data": data, "raw": raw_text, "error": err}
          else:
              with concurrent.futures.ThreadPoolExecutor(max_workers=concurrency) as executor:
                  futures = {
                      executor.submit(review_axis, axis_name, prompt): axis_name
                      for axis_name, prompt in axes_tasks
                  }
                  for future in concurrent.futures.as_completed(futures):
                      axis_name, data, raw_text, err = future.result()
                      results[axis_name] = {"data": data, "raw": raw_text, "error": err}

          # Sort and merge
          severity_order = {"blocker": 0, "warning": 1}
          all_findings = []
          for axis_name in ["correctness", "method", "scope", "structure"]:
              res = results.get(axis_name, {})
              data = res.get("data")
              if data and isinstance(data, dict) and "findings" in data and isinstance(data["findings"], list):
                  for f in data["findings"]:
                      if isinstance(f, dict):
                          f_copy = dict(f)
                          f_copy["axis"] = axis_name
                          all_findings.append(f_copy)

          all_findings.sort(key=lambda x: severity_order.get(str(x.get("severity", "")).lower(), 2))
          high_priority = [f for f in all_findings if str(f.get("severity", "")).lower() in ["blocker", "warning"]][:5]

          model_label = f"{os.environ.get('LLM_PROVIDER', '?')}/{os.environ.get('LLM_MODEL', '?')}"
          lines = [f"## PR Review — {model_label} (4 Axes)\n"]
          if diff_truncated:
              lines.append("> WARNING: diff was truncated, review may be incomplete\n")
          lines.append("### Key Findings (Blocker & Warning)")
          if high_priority:
              for f in high_priority:
                  sev = str(f.get("severity", "warning")).upper()
                  loc = f.get("location", "-")
                  title = f.get("title", "")
                  detail = f.get("detail", "")
                  lines.append(f"- **[{sev}]** `{loc}` {title} — {detail}")
          else:
              lines.append("- No blocker or warning level findings detected.")

          lines.append("\n---\n")

          axis_display_names = {
              "correctness": "Correctness",
              "method": "Method",
              "scope": "Scope",
              "structure": "Structure",
          }

          for axis_name in ["correctness", "method", "scope", "structure"]:
              res = results.get(axis_name, {})
              disp_name = axis_display_names.get(axis_name, axis_name)
              err = res.get("error")
              if err:
                  lines.append(f"<details>\n<summary><b>{disp_name} — PARSE ERROR</b></summary>\n\nParse error: `{err}`\n\n```\n{res.get('raw', '')}\n```\n</details>\n")
              else:
                  data = res.get("data") or {}
                  findings = data.get("findings", []) if isinstance(data, dict) and isinstance(data.get("findings"), list) else []
                  count = len(findings)
                  lines.append(f"<details>\n<summary><b>{disp_name} ({count} findings)</b></summary>\n")
                  if count == 0:
                      lines.append("\nNo findings.\n")
                  else:
                      lines.append("")
                      for f in findings:
                          if isinstance(f, dict):
                              sev = str(f.get("severity", "warning")).upper()
                              loc = f.get("location", "-")
                              title = f.get("title", "")
                              detail = f.get("detail", "")
                              lines.append(f"- **[{sev}]** `{loc}` **{title}**: {detail}")
                      lines.append("")
                  lines.append("</details>\n")

          lines.append("<details>\n<summary><b>Raw JSON Output</b></summary>\n")
          lines.append(f"\ndiff truncated: {'yes' if diff_truncated else 'no'}\n")
          lines.append("```json")
          raw_output = {}
          for k in ["correctness", "method", "scope", "structure"]:
              res = results.get(k, {})
              if res.get("data") is not None:
                  raw_output[k] = res["data"]
              else:
                  raw_output[k] = {"raw": res.get("raw"), "error": res.get("error")}
          lines.append(json.dumps(raw_output, indent=2, ensure_ascii=False))
          lines.append("```\n</details>\n")

          output_md = "\n".join(lines)
          pathlib.Path("/tmp/review.md").write_text(output_md, encoding="utf-8")
          PY

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.md
