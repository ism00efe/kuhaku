[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kuhaku"
version = "0.2.0"
description = "kuhaku: a provider-agnostic AI orchestration framework (LLM abstraction, retrieval, evaluation, observability, security)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ism00efe"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# The base install stays light: nothing heavy (torch, chromadb, sentence-transformers,
# scikit-learn) is in it. Those come with the feature that needs them -- the extras
# below, or kuhaku's resolver, which asks before it installs a missing package.
dependencies = [
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "filetype>=1.2",
    "pypdf>=5.0",
    # Retry-with-backoff for transient external-dependency failures (D40).
    "tenacity>=8.2",
    # OpenTelemetry (D57): tracing + metrics, the single telemetry standard --
    # core/observability/telemetry.py. telemetry.py imports prometheus_client directly
    # (one module, deliberately contained there); opentelemetry-exporter-prometheus
    # additionally registers its collector into the same default REGISTRY so the
    # existing Prometheus-exposition consumer keeps working unmodified.
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "prometheus-client>=0.20",
    # JWT authentication (core/auth/providers.py)
    "PyJWT>=2.8",
]

[project.urls]
Homepage = "https://github.com/ism00efe/kuhaku"
Repository = "https://github.com/ism00efe/kuhaku"
Issues = "https://github.com/ism00efe/kuhaku/issues"
Changelog = "https://github.com/ism00efe/kuhaku/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The test suite covers every feature, so it needs every optional package.
dev = [
    "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "build>=1.2",
    "chromadb>=0.5", "sentence-transformers>=3.0", "scikit-learn>=1.4", "joblib>=1.3",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
# Local RAG: the Chroma vector store and sentence-transformers embeddings (pulls torch).
# Without it, RAG asks before installing these the first time they are needed.
rag = ["chromadb>=0.5", "sentence-transformers>=3.0"]
# Dense (embedding) retrieval alone -- the name the resolver's install prompt gives.
dense = ["sentence-transformers>=3.0"]
# Prompt Injection Guard v2's trained Stage-1 model (core/security/classifier.py's
# LRModelScorer). joblib is pinned explicitly even though scikit-learn pulls it --
# classifier.py calls joblib.load() directly.
guard = ["scikit-learn>=1.4", "joblib>=1.3", "numpy>=1.26"]
# Sending traces to an OTLP collector (OTEL_TRACES_EXPORTER=otlp). Pulls in grpcio; the
# base install exports nothing, so it does not need it.
otlp = ["opentelemetry-exporter-otlp-proto-grpc>=1.27"]
# Google Vertex AI (LLM + embeddings), for users with Google Cloud credits. Optional --
# both providers import it lazily, so it never blocks the local (Ollama) default.
vertex = ["google-genai>=1.0.0"]
# Building the documentation site (mkdocs build). Separate from `dev` -- most
# contributors never need to build the site locally.
docs = ["mkdocs-material>=9.5"]

# src layout: the importable package lives at src/kuhaku/. Nothing outside src/ is
# packaged, so tests/ and scripts/ stay in the repository but never reach the wheel.
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# system_prompt.txt / query_rewriter_system_prompt.txt are loaded at runtime relative to
# kuhaku/tools/rag/prompts.py's own file location, not the CWD, so the wheel must carry
# them for a standalone `pip install` to work (see tools/rag/prompts.py, tools/rag/query_rewriter.py).
[tool.setuptools.package-data]
"kuhaku" = ["py.typed"]
"kuhaku.tools.rag" = ["prompts/*.txt"]

# pythonpath keeps `pytest` runnable straight from a clone, without an editable install.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
