[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kuhaku"
version = "0.1.0"
description = "kuhaku: a provider-agnostic AI orchestration framework (LLM abstraction, retrieval, evaluation, observability, security)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ism00efe"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic-settings>=2.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "requests>=2.31",
    "numpy>=1.26",
    "filetype>=1.2",
    "pypdf>=5.0",
    # Prompt Injection Guard v2 (D39): Stage-1's optional trained-model swap-in
    # (core/security/classifier.py's LRModelScorer). Pinned explicitly even though
    # scikit-learn pulls joblib transitively -- classifier.py calls joblib.load()
    # directly, not through sklearn's API.
    "scikit-learn>=1.4",
    "joblib>=1.3",
    # Retry-with-backoff for transient external-dependency failures (D40).
    "tenacity>=8.2",
    # OpenTelemetry (D57): tracing + metrics, the single telemetry standard --
    # core/observability/telemetry.py. `prometheus-client` is no longer a direct
    # dependency; it arrives transitively via opentelemetry-exporter-prometheus, which
    # registers its own collector into prometheus_client's default REGISTRY so the
    # existing Prometheus-exposition consumer keeps working unmodified.
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    # JWT authentication (core/auth/providers.py)
    "PyJWT>=2.8",
]

[project.urls]
Homepage = "https://github.com/ism00efe/kuhaku"
Repository = "https://github.com/ism00efe/kuhaku"
Issues = "https://github.com/ism00efe/kuhaku/issues"
Changelog = "https://github.com/ism00efe/kuhaku/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]
# Google Vertex AI (LLM + embeddings), for users with Google Cloud credits. Optional --
# both providers import it lazily, so it never blocks the local (Ollama) default.
vertex = ["google-genai>=1.0.0"]
# Building the documentation site (mkdocs build). Separate from `dev` -- most
# contributors never need to build the site locally.
docs = ["mkdocs-material>=9.5"]

# src layout: the importable package lives at src/kuhaku/. Nothing outside src/ is
# packaged, so tests/ and scripts/ stay in the repository but never reach the wheel.
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# system_prompt.txt / query_rewriter_system_prompt.txt are loaded at runtime relative to
# kuhaku/tools/rag/prompts.py's own file location, not the CWD, so the wheel must carry
# them for a standalone `pip install` to work (see tools/rag/prompts.py, tools/rag/query_rewriter.py).
[tool.setuptools.package-data]
"kuhaku.tools.rag" = ["prompts/*.txt"]

# pythonpath keeps `pytest` runnable straight from a clone, without an editable install.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
